name: Build Windows executable

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Branch, tag ou commit a empacotar"
        required: false
        default: "main"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref_name }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Build executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name GeradorArquivosTeste --icon=icone.ico
          --add-data "capa.png;." gerador.py

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeradorArquivosTeste-Windows
          path: dist/GeradorArquivosTeste.exe
          if-no-files-found: error
          retention-days: 30
